[package]
name = "natslink"
version = "1.8.4"
edition = "2021"
rust-version = "1.91"
description = "One NATS connection bound to one subject, as a self-healing unit (Rust port of github.com/Jolly23/natslink)"
license = "MIT"
repository = "https://github.com/Jolly23/natslink-rs"
readme = "README.md"
keywords = ["nats", "messaging", "reconnect", "supervision"]
categories = ["network-programming", "asynchronous"]
publish = false

# Distributed as a git dependency pinned by tag (see README "Install"); the
# empty [workspace] makes this crate its own root.
[package.metadata.go-reference]
module = "github.com/Jolly23/natslink"
version = "v1.8.4"
revision = "d89b206c94c26580371cf72f05a8add300c78b87"
checksum = "h1:5Q8Pj9zZxmm2ckeW3C3vRK4dmfaQ30zmJUbZkz1KKFk="

[workspace]

[dependencies]
rapidhash = { version = "4.5", default-features = false }
async-nats = { version = "0.50", default-features = false, features = ["ring"] }
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
rand = "0.10"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
