name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    name: unit (rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.91", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 .github/scripts/check_reference.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  integration:
    name: integration (two NATS servers)
    runs-on: ubuntu-latest
    needs: unit
    env:
      TOKEN: natslink-itest-token
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: start two NATS servers
        run: |
          docker run -d --name natslink-nats-1 -p 127.0.0.1:4222:4222 nats:latest --auth "$TOKEN"
          docker run -d --name natslink-nats-2 -p 127.0.0.1:4223:4222 nats:latest --auth "$TOKEN"
          for i in $(seq 1 30); do
            if docker logs natslink-nats-1 2>&1 | grep -q 'Server is ready' && \
               docker logs natslink-nats-2 2>&1 | grep -q 'Server is ready'; then exit 0; fi
            sleep 1
          done
          echo "NATS servers did not become ready"; docker logs natslink-nats-1; exit 1
      - name: run full suite
        env:
          NATS_TEST_URL: nats://${{ env.TOKEN }}@127.0.0.1:4222
          NATS_TEST_URL2: nats://${{ env.TOKEN }}@127.0.0.1:4223
          NATS_TEST_CONTAINER: natslink-nats-1
        run: cargo test --locked -- --test-threads=4
      - name: ACL hot-reload drill
        env:
          NATSLINK_ACL_DOCKER_TEST: "1"
        run: cargo test --locked --test rejection -- --ignored --nocapture
      - name: stop servers
        if: always()
        run: docker rm -f natslink-nats-1 natslink-nats-2 || true

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  conformance:
    name: shared Go/Rust contract
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - name: resolve pinned Go commit
        id: go_reference
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          sha = Path(".github/conformance-go.sha").read_text().strip()
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("Go conformance reference must be a full commit ID")
          print(f"sha={sha}")
          PY
      - uses: actions/checkout@v7
        with:
          repository: Jolly23/natslink
          ref: ${{ steps.go_reference.outputs.sha }}
          path: _conformance/go
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: _conformance/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 .github/scripts/check_contract.py _conformance/go
